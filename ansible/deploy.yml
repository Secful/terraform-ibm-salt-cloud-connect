---
# Salt Security Cloud Connect — IBM Cloud deployment (Ansible variant)
#
# Functional equivalent of the root Terraform module with explicit
# Initiated/Succeeded/Failed reporting to the Salt backend via block/rescue.
#
# Usage:
#   export IC_API_KEY='your-ibm-cloud-api-key'
#   ansible-playbook deploy.yml \
#     -e salt_host=https://api.salt.security \
#     -e salt_auth_token=<token> \
#     [-e attempt_id=<uuid>]
#
# Structure: this file installs ibm.cloudcollection at runtime and then
# dynamically includes ibm_tasks.yml. The ibm.cloudcollection module
# references live in ibm_tasks.yml so Ansible doesn't try to resolve them
# at playbook-parse time (before the install has run).

- name: Salt Security Cloud Connect — IBM Cloud
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Required (pass via -e)
    salt_host: ""
    salt_auth_token: ""

    # Optional (pass via -e or auto-generated)
    attempt_id: ""

    # Derived / internal
    stack_id: "{{ lookup('password', '/dev/null chars=hex length=8') }}"
    installation_id: "{{ 99999999999999999999 | random | to_uuid }}"
    effective_attempt_id: "{{ attempt_id if attempt_id | length > 0 else (99999999999999999999 | random | to_uuid) }}"
    created_by: "Ansible"

    service_id_name: "salt-security-sid-{{ stack_id }}"
    api_key_name: "salt-security-key-{{ stack_id }}"
    access_group_name: "salt-security-ag-{{ stack_id }}"

    ibm_region: "us-south"

    ibm_account_id: ""
    ibm_api_key: ""

  tasks:
    - name: Verify required variables are set
      assert:
        that:
          - salt_host | length > 0
          - salt_auth_token | length > 0
        fail_msg: "salt_host and salt_auth_token must be provided via -e"

    - name: Verify IC_API_KEY is set in environment
      assert:
        that:
          - lookup('env', 'IC_API_KEY') | length > 0
        fail_msg: "IC_API_KEY environment variable is required"

    # Schematics Action runners don't auto-install from requirements.yml;
    # install the IBM collection at runtime so the playbook is self-contained.
    - name: Install ibm.cloudcollection at runtime
      command: ansible-galaxy collection install -r {{ playbook_dir }}/requirements.yml
      changed_when: false

    # Dynamic include — FQCN modules inside this file are resolved at
    # runtime, AFTER the install above. Do not convert to import_tasks;
    # that resolves at parse time and will fail the same way.
    - name: Run IBM deployment tasks
      include_tasks: ibm_tasks.yml